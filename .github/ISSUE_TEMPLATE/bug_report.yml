name: Bug report
description: Something in Strata doesn't work as documented
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    value: |
      Thanks for the report.

      Please search the [open issues](https://github.com/sergqwer/strata-nvfp4/issues?q=is%3Aissue+state%3Aopen) first — this may already be tracked.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you got, and what you expected instead. Paste the exact error text if there is one.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Smallest steps or command that reproduce it
      description: The shortest list of steps that shows the problem. If you cannot make it happen again, say so here.
    validations:
      required: false
  - type: dropdown
    id: reproduction-status
    attributes:
      label: Reproduction status
      options:
        - Reproduced locally
        - Unconfirmed static analysis (I read code or ran a scanner; I did not see it fail)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Strata version
      description: "In the app: Settings > About. In the Terminal: `strata --version`. From source: the About tab of the web page, or `engine` in `GET /v1/status`, or the git commit."
      placeholder: "Strata 0.2.8 · engine 0.1.54"
    validations:
      required: true
  - type: input
    id: hardware
    attributes:
      label: Strata version, GPU, OS
      description: The engine version is on the About tab, or in `GET /v1/status` under `engine`.
      placeholder: "0.1.31 · RTX 5070 12GB · Windows 11"
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Engine log
      description: Drag in `strata-<model>.log` from your Strata folder. Drag and drop works directly into this box.
    validations:
      required: false
  - type: markdown
    value: |
      A couple of extras that help a lot:

      - Check the [troubleshooting table](https://github.com/sergqwer/strata-nvfp4/blob/main/docs/DETAILS.md#troubleshooting) first, many reports are already solved there.